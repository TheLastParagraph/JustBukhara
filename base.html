<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Template | Just Bukhara</title>
    
    <meta name="description" content="Base template for new pages on the Just Bukhara website.">
    
    <!-- Core Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Note: If using a backend framework like Django/Jinja, replace the placeholders below with your template tags (e.g. {% block content %}) -->
    <style>
        /* Add any page-specific CSS here */
    </style>
</head>
<body>

    <!-- The dynamic Javascript loader will inject header.html here -->
    <!-- (If moving to Django/Flask, replace this with an include statement) -->
    <div id="header-placeholder"></div>

    <!-- MAIN PAGE CONTENT GOES HERE -->
    <main>
        
        <section class="section" style="padding-top: 10rem;">
            <div class="container text-center">
                <h1>New Page Title</h1>
                <p>Start building your new page content here!</p>
            </div>
        </section>

    </main>

    <!-- The dynamic Javascript loader will inject footer.html here -->
    <div id="footer-placeholder"></div>

    <!-- Core Javascript -->
    <script src="script.js"></script>
    
    <script>
        // Add any page-specific Javascript here
    </script>
</body>
</html>
