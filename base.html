<!DOCTYPE html>

<head>

    <meta name="description" content="Base template for new pages on the Just Bukhara website.">
    
    <!-- Core Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Note: If using a backend framework like Django/Jinja, replace the placeholders below with your template tags (e.g. {% block content %}) -->

<body>

    <!-- Master Header -->
    <header class="navbar">
        <div class="container navbar-container">
            <nav class="nav-links" id="main-nav">
                <a href="index.html" data-page="index">Home</a>
                <a href="products.html" data-page="products">Menu</a>
                <a href="about.html" data-page="about">About</a>
                <a href="index.html#location">Location</a>
            </nav>
            <div class="logo" id="main-logo">Just Bukhara</div>
            <div class="nav-controls">
                <a href="index.html#location" class="btn btn-primary contact-btn" id="contact-btn">Contact Us</a>
                <button class="hamburger" aria-label="Menu" id="main-hamburger">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN PAGE CONTENT GOES HERE -->
    <main>
        
        <section class="section" style="padding-top: 10rem;">
            <div class="container text-center">
                <h1>New Page Title</h1>

                <div class="newsletter">
                    <h2>Stay in touch</h2>
                    <div class="newsletter-form">
                        <input type="tel" placeholder="Enter your phone number">
                        <button class="btn btn-dark">Subscribe</button>
                    </div>
                </div>
                <div class="footer-links">
                    <ul>
                        <li><a href="products.html">Full Menu</a></li>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="index.html#location">Location</a></li>
                    </ul>
                    <ul>
                        <li><a href="tel:+919597710592">Call +91 95977 10592</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom fade-up">
                <h2 class="footer-logo">Just Bukhara</h2>
                <div class="footer-meta">
                    <p>Opposite Indian Oil Petrol Pump,<br>Magam, J&K 193401</p>
                    <p>&copy; 2026 Just Bukhara</p>
                </div>
            </div>
        </div>

        // Add any page-specific Javascript here
